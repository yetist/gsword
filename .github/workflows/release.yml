name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            desktop-file-utils \
            gettext \
            jq \
            libadwaita-1-dev \
            libbz2-dev \
            libcurl4-openssl-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            liblzma-dev \
            libsqlite3-dev \
            libxml2-dev \
            meson \
            ninja-build \
            pkg-config \
            xauth \
            xvfb \
            zlib1g-dev

      - name: Configure
        run: meson setup build --buildtype=release -Dtests=true

      - name: Check tag matches project version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(meson introspect build --projectinfo | jq -r .version)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Tag version '$tag_version' does not match project version '$project_version'" >&2
            exit 1
          fi

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Build source archive
        run: meson dist -C build --no-tests

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/meson-dist/*.tar.xz \
            build/meson-dist/*.sha256sum \
            --title "GSword ${GITHUB_REF_NAME#v}" \
            --generate-notes
